<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit User</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/edit_user.css') }}">
</head>

<body>

<div class="container">

    <div class="card">

        <h2>✏️ Edit User</h2>

        <form action="/admin/users/update/{{ user[0] }}" method="POST">

            <label>Name</label>
            <input type="text" name="name" value="{{ user[1] }}" required>

            <label>Email</label>
            <input type="email" name="email" value="{{ user[2] }}" required>

            <label>Role</label>
            <select name="role">
                <option value="admin" {% if user[3]=='admin' %}selected{% endif %}>Admin</option>
                <option value="doctor" {% if user[3]=='doctor' %}selected{% endif %}>Doctor</option>
                <option value="patient" {% if user[3]=='patient' %}selected{% endif %}>Patient</option>
            </select>

            <button type="submit">Update User</button>

        </form>

        <a class="back" href="/admin/users">⬅ Back to Users</a>

    </div>

</div>
<script src="{{ url_for('static', filename='js/edit_user.js') }}"></script>
</body>
</html>
