<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>My History</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom CSS (optional later) -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/my_history.css') }}">

</head>

<body class="bg-dark text-light">

<div class="container py-5">

    <!-- HEADER -->
    <h2 class="text-center text-success mb-4">
        🧬 My Malaria Prediction History
    </h2>

    <!-- EMPTY CHECK -->
    {% if history %}

    <div class="row">

        {% for h in history %}

        <div class="col-md-4 mb-4">

            <div class="card bg-secondary text-white shadow-lg border-0">

                <!-- IMAGE (ONLY IF YOU STORE IMAGE IN INDEX 1) -->
                <img src="{{ url_for('static', filename='uploads/' + h[1]) }}"
                     class="card-img-top"
                     style="height:220px; object-fit:cover;">

                <div class="card-body">

                    <!-- RESULT -->
                    <h5 class="card-title">

                        {% if 'Parasitized' in h[2] %}
                            <span class="text-danger">⚠ {{ h[2] }}</span>
                        {% else %}
                            <span class="text-success">✔ {{ h[2] }}</span>
                        {% endif %}

                    </h5>

                    <!-- CONFIDENCE -->
                    <p class="mb-1">
                        Confidence:
                        <strong>{{ h[3] }}%</strong>
                    </p>

                    <!-- DATE -->
                    <small class="text-light">
                        📅 {{ h[4] }}
                    </small>

                </div>

            </div>

        </div>

        {% endfor %}

    </div>

    {% else %}

        <!-- EMPTY STATE -->
        <div class="text-center mt-5">

            <h4 class="text-warning">
                No prediction history found
            </h4>

            <p>Start by uploading a blood sample image.</p>

        </div>

    {% endif %}

</div>

</body>
</html>
