<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>Patients Records</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/patients.css') }}">

</head>

<body>

<div class="container mt-5">

    <h2 class="text-center mb-4">
        Patient Prediction Records
    </h2>

    <table class="table table-bordered table-hover">

        <thead class="table-dark">

            <tr>
                <th>ID</th>
                <th>Patient Name</th>
                <th>Email</th>
                <th>Image</th>
                <th>Result</th>
                <th>Confidence</th>
            </tr>

        </thead>

        <tbody>

            {% for p in patients %}

            <tr>

                <td>{{ p[0] }}</td>
                <td>{{ p[1] }}</td>
                <td>{{ p[2] }}</td>

                <td>
                    <img src="{{ url_for('static', filename='uploads/' + p[3]) }}"
                         width="70" height="70">
                </td>

                <td>
                    {{ p[4] }}
                </td>

                <td>
                    {{ p[5] }}%
                </td>

            </tr>

            {% endfor %}

        </tbody>

    </table>

</div>

</body>
</html>
